[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutdaejang"
version = "1.11.1"
description = "컷대장 — 유튜브 쇼츠·영상 자동 제작 (대본→TTS→배경→자막→mp4)"
requires-python = ">=3.10"
# 런타임 의존성 없음(표준 라이브러리만) — PyInstaller 패키징·고객 PC 설치 문제 최소화.
# FFmpeg/ffprobe(libass 포함 빌드)는 외부 바이너리로 동봉한다.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cutdaejang = "cutdaejang.__main__:main"

[tool.setuptools.packages.find]
include = ["cutdaejang*"]

# 폰트·효과음 등 리소스를 wheel/sdist에 포함 (v0.70 — pip 설치 시 폰트 누락 수정)
[tool.setuptools.package-data]
cutdaejang = ["resources/fonts/*.ttf", "resources/fonts/*.txt",
              "resources/sfx/*", "resources/bgm/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
